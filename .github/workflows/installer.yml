name: Windows installer

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to attach the installer to a release

jobs:
  build:
    runs-on: windows-2022 # ships WiX Toolset 3.x, required by jpackage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      - name: Build installer
        run: ./gradlew.bat packageInstaller

      - uses: actions/upload-artifact@v4
        with:
          name: FolderMania-installer
          path: build/jpackage/output/*.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/jpackage/output/*.exe
